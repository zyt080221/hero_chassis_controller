PACKAGE = "hero_chassis_controller"
from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()

# 定义 P, I, D 三个参数，类型为 double，默认值 10.0, 0.1, 0.0，范围 0 到 100
gen.add("p", double_t, 0, "Proportional gain", 10.0, 0.0, 100.0)
gen.add("i", double_t, 0, "Integral gain", 0.1, 0.0, 10.0)
gen.add("d", double_t, 0, "Derivative gain", 0.0, 0.0, 10.0)

exit(gen.generate(PACKAGE, "hero_chassis_controller", "Pid"))
